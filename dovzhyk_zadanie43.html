	<body>
		<h1>Pętla for</h1>
			<textarea rows=5 cols=100>
for (zainicjowanie_zmiennej;   
zmiana_zmiennej) { 
warunek_kończący_wykonywanie_pętli;  
kod który zostanie wykonany pewną ilość razy 
}  
			</textarea><br>
			<img src="blokowy schemat for.png">
		<br>
		<h1>Pętla while -> z kontrolowanym wejściem</h1>
<textarea rows=3 cols=100>
while (wyrażenie_sprawdzające_zakończenie_pętli) { 
...fragment kodu który będzie powtarzany... 
} 
</textarea><br>
pętla while najpierw sprawdza warunek, potem coś wykonuje, pętla może się nie wykonać.<br>
		<img src="blokowy schemat while.png">
		<br>

		<h1>Pętla do  while -> z kontrolowanym wyjściem </h1>
		<textarea rows=3 cols=100>
do{ 
...fragment kodu który będzie powtarzany... 
} while (false) 
		</textarea><br>
pętla do...while zawsze wykona jedną iterację, zanim sprawdzi warunek. Zawsze więc wykona jakieś zadanie<br>
		<img src="blokowy schemat do while.png">

	</body>
