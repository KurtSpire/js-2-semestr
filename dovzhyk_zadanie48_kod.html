<!DOCTYPE html> 
<html> 
	<head>
		<title>Sprawdzenie danych Dovzhyk </title>
		<meta charset="utf-8">
	</head>
	<body>  
		<div style="color:red;font-size:50px;"> 
		<script language="JavaScript"> 
			do 
			{ 
				var liczba1=prompt("wysokość=",""); 
				var h_dov=parseFloat(liczba1); 
			} while ( h_dov<=0); 
			
			do 
			{ 
				var liczba1=prompt("podstawę=",""); 
				var a_dov=parseFloat(liczba1); 
			} while(!( a_dov>0)); 
			var Pole=a_dov*h_dov/2; 
			document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>");  
		</script> 
		</div> 
	</body> 
</html>

	</body>
