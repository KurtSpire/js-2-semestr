<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:red;font-size:50px;"> 
		<script language="JavaScript"> 
			var suma_dov=0;
			
			for(i_d=1;i_d<=1000000;i_d++)
			{
				suma_dov=suma_dov+1/i_d;
			} 
			document.write("Suma = " + suma_dov.toFixed(2));
		</script> 
		</div>
	</body> 
</html>
