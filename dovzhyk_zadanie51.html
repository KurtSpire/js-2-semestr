<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<script language="JavaScript"> 
			do
			{
				var n_dov=parseFloat(prompt('Podaj n = ',''));
			} while(n_dov<0)
			
			document.write("n = "+n_dov+"<br>");
			var silnia_dov=1;
			
			if(n_dov==0)
			{
				silnia_dov=1;
				document.write(silnia_dov+"! = "+silnia_dov);
			}
			else
			{
				var wynik_dov=1;
				for(i=1;i<=n_dov;i++)
				{
					wynik_dov=wynik_dov*i;
				}
				document.write(n_dov+"! = "+wynik_dov);
			}
		</script> 
	</body> 
</html>
