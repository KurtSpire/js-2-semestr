<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
		<title>Przykład użycia pętli</title>
	</head>
	<body> 
		<script language="JavaScript"> 
			for ( var i_d=1; i_d<=10; i_d++) 
			{ 
				for ( var k_d=1; k_d<=i_d; k_d++) 
				{ 
				document.write("&nbsp");     
				} 
			document.write(i_d+"<br>"); 
			}
		</script> 
	</body> 
</html>
