<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:red;font-size:50px;"> 
		<script language="JavaScript"> 
		function start_dov()
		{
			do
			{
			var a_dov=parseFloat(prompt('Podaj bok a = ',''));
			} while(a_dov<=0)
			do
			{
			var b_dov=parseFloat(prompt('Podaj bok b = ',''));
			} while(b_dov<=0)
			do
			{
			var c_dov=parseFloat(prompt('Podaj bok c = ',''));
			} while(c_dov<=0)
			
			if((a_dov+b_dov>c_dov)&&(a_dov+c_dov>b_dov)&&(c_dov+b_dov>a_dov))
			{
				document.write("Boki to "+a_dov+" "+b_dov+" "+c_dov)
			} else
			{
			start_dov();
			}
		}
		start_dov();
		</script> 
		</div>
	</body> 
</html>
